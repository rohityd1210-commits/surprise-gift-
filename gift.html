
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Surprise Gift</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Trebuchet MS', sans-serif;
  background: linear-gradient(135deg, #180d35, #54246e, #bd609b);
  color: white;
  text-align: center;
}

.container {
  width: 90%;
  max-width: 420px;
  padding: 30px 20px;
  border: 1px solid #ffffff55;
  border-radius: 25px;
  background: #ffffff18;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 35px #ff8bdc55;
  z-index: 2;
}

.anime {
  font-size: 65px;
  margin-bottom: 15px;
  animation: float 2s infinite ease-in-out;
}

h1 {
  font-size: 27px;
  color: #ffc5ed;
  margin-bottom: 12px;
}

p {
  font-size: 16px;
  line-height: 1.6;
  margin-bottom: 22px;
}

button {
  padding: 15px 28px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(90deg, #ff79c6, #b77aff);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px #ff8bdc;
  transition: 0.3s;
}

button:active {
  transform: scale(0.92);
}

#message {
  display: none;
  margin-top: 25px;
  animation: appear 1s ease;
}

#message h2 {
  color: #ffe0f5;
  font-size: 26px;
  margin-bottom: 12px;
}

#message .big {
  font-size: 43px;
}

.heart {
  position: absolute;
  bottom: -30px;
  animation: rise 7s linear infinite;
  opacity: 0.7;
  pointer-events: none;
}

@keyframes float {
  50% { transform: translateY(-12px); }
}

@keyframes appear {
  from { opacity: 0; transform: scale(0.5); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes rise {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="anime">🌸✨</div>

  <h1>Hey All Friends!</h1>

  <p>
    Someone has a special surprise for you... 💗
    <br>
    Are you ready?
  </p>

  <button id="giftBtn" onclick="openGift()">
    Open Surprise 🎁
  </button>

  <div id="message">
    <div class="big">🎉❤️🌸</div>

    <h2>Happy Goverdhan Puja!</h2>

    <p>
      May your life be filled with happiness,
      peace and blessings. ❤️
      <br><br>
      Sending lots of love to all my friends!
      🌸✨
    </p>

    <div class="big">🙏💖</div>
  </div>

</div>

<script>
function openGift() {
  document.getElementById("message").style.display = "block";

  document.getElementById("giftBtn").style.display = "none";

  createHearts();
}

function createHearts() {
  for (let i = 0; i < 30; i++) {
    let heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = ["💗", "🌸", "✨", "❤️"][
      Math.floor(Math.random() * 4)
    ];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDelay = Math.random() * 4 + "s";
    heart.style.fontSize = (15 + Math.random() * 20) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
  }
}
</script>

</body>
</html>
